[project]
name = "roadside-drive"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "numpy>=2.5.5",
    "osmnx>=2.1.2",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "trimesh>=5.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
